version: 1
source: fixture
contentDatabases:
  - id: chemistry-notes
    name: Chemistry Notes
    sourceDataSourceId: fixture-chemistry-notes
    titlePropertyId: fixture-title
    defaultTemplate: simple
    templates:
      - simple
      - compact-emblem
      - cactus-study
    sort:
      - field: created_time
        direction: ascending
    variables:
      title:
        propertyId: fixture-title
        type: string
        required: true
      mainClass:
        propertyId: fixture-main-class
        type: reference
        required: true
      subClass:
        propertyId: fixture-sub-class
        type: reference
        required: true
      codeName:
        propertyId: fixture-code-name
        type: string
        required: true
      tags:
        propertyId: fixture-tags
        type: string[]
    filters:
      tags:
        propertyId: fixture-tags
        type: string[]
        sourceType: multi_select
        operators: [contains]
      mainClass:
        propertyId: fixture-main-class
        type: reference
        sourceType: relation
        operators: [equals]
relationSources:
  - fixture-classifications
presentation:
  version: 1
  locale: ja-JP
  brand:
    name: Notion Reader
    shortName: Reader
    eyebrow: Personal reference
    tagline: Your Notion, shaped for reading.
  articleHeaders:
    simple:
      name: Simple
      renderer: field-grid
      title: { placement: content, alignment: center }
      tone: panel
      density: comfortable
      fields:
        - { variable: mainClass, label: Main-class, width: half }
        - { variable: subClass, label: Sub-class, width: half }
        - { variable: codeName, label: Code name, width: full, emphasis: strong }
    compact-emblem:
      name: Compact Emblem
      renderer: compact-emblem
      title: { placement: content, alignment: center }
      tone: panel
      density: compact
      emblemVariable: mainClass
      headlineVariable: codeName
      headlineFallback: title
      caption: Classification record
      fields:
        - { variable: mainClass, label: Main-class, width: half }
        - { variable: subClass, label: Sub-class, width: half }
    cactus-study:
      name: Cactus Study
      renderer: cactus-study
      title: { placement: content, alignment: center }
      tone: panel
      density: comfortable
      headlineVariable: codeName
      headlineLabel: Code name
      headlineFallback: title
      seriesMark: "Ⅶ"
      seriesLabel: Reference file
      caption: Classification record
      fields:
        - { variable: mainClass, label: Main-class }
        - { variable: subClass, label: Sub-class }
        - { variable: tags, label: Tag, showIcon: false }
