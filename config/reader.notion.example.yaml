version: 1
source: notion
contentDatabases:
  - id: chemistry-notes
    name: Chemistry Notes
    sourceDataSourceId: "replace-with-notion-data-source-id"
    titlePropertyName: "Name"
    defaultTemplate: compact-emblem
    templates: [simple, compact-emblem]
    sort:
      - field: created_time
        direction: ascending
    variables:
      title:
        propertyName: "Name"
        type: string
        required: true
      mainClass:
        propertyName: "Main class"
        type: reference
        required: true
      subClass:
        propertyName: "Sub class"
        type: reference
        required: true
      codeName:
        propertyName: "Code name"
        type: string
        required: true
      tags:
        propertyName: "Tags"
        type: string[]
    filters:
      tags:
        propertyName: "Tags"
        type: string[]
        sourceType: multi_select
        operators: [contains]
      mainClass:
        propertyName: "Main class"
        type: reference
        sourceType: relation
        operators: [equals]
relationSources:
  - "replace-with-relation-data-source-id"
