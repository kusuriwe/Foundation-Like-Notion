version: 1
source: notion
contentDatabases:
  - id: chemistry-notes
    name: Chemistry Notes
    sourceDataSourceId: "replace-with-notion-data-source-id"
    titlePropertyName: "Name"
    defaultTemplate: compact-emblem
    templates: [simple, compact-emblem, cactus-study]
    sort:
      - field: created_time
        direction: ascending
    variables:
      title:
        propertyName: "Name"
        type: string
        required: true
      mainClass:
        propertyName: "Main class"
        type: reference
        required: true
      subClass:
        propertyName: "Sub class"
        type: reference
        required: true
      codeName:
        propertyName: "Code name"
        type: string
        required: true
      tags:
        propertyName: "Tags"
        type: string[]
    filters:
      tags:
        propertyName: "Tags"
        type: string[]
        sourceType: multi_select
        operators: [contains]
      mainClass:
        propertyName: "Main class"
        type: reference
        sourceType: relation
        operators: [equals]
relationSources:
  - "replace-with-relation-data-source-id"
presentation:
  version: 1
  locale: ja-JP
  brand:
    name: Notion Reader
    shortName: Reader
    eyebrow: Personal reference
    tagline: Your Notion, shaped for reading.
  articleHeaders:
    simple:
      name: Simple
      renderer: field-grid
      title: { placement: content, alignment: center }
      tone: panel
      density: comfortable
      fields:
        - { variable: mainClass, label: Main-class, width: half }
        - { variable: subClass, label: Sub-class, width: half }
        - { variable: codeName, label: Code name, width: full, emphasis: strong }
    compact-emblem:
      name: Compact Emblem
      renderer: compact-emblem
      title: { placement: content, alignment: center }
      tone: panel
      density: compact
      emblemVariable: mainClass
      headlineVariable: codeName
      headlineFallback: title
      caption: Classification record
      fields:
        - { variable: mainClass, label: Main-class, width: half }
        - { variable: subClass, label: Sub-class, width: half }
    cactus-study:
      name: Cactus Study
      renderer: cactus-study
      title: { placement: content, alignment: center }
      tone: panel
      density: comfortable
      headlineVariable: codeName
      headlineLabel: Code name
      headlineFallback: title
      seriesMark: "Ⅶ"
      seriesLabel: Reference file
      caption: Classification record
      fields:
        - { variable: mainClass, label: Main-class }
        - { variable: subClass, label: Sub-class }
        - { variable: tags, label: Tag, showIcon: false }
