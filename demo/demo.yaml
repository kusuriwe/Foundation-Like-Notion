presentation:
  version: 1
  locale: ja-JP
  brand:
    name: Foundation Reader Demo
    shortName: Reader Demo
    eyebrow: Curated knowledge
    tagline: Reading notes, shaped with care.
  theme:
    colorScheme: dark
    colors:
      accent: "#f4d35e"
      accentSecondary: "#80edff"
  messages:
    demoTitle: Foundation Readerを試す
    demoDescription: このサイトは公開用のダミーデータだけを端末内で表示する静的PWAです。
    demoStart: ダミーデータで開始
  articleHeaders:
    showcase-grid:
      name: Showcase Grid
      renderer: field-grid
      title:
        placement: header
        alignment: start
      tone: accent
      density: comfortable
      fields:
        - variable: mainClass
          label: Domain
          width: half
          showIcon: true
        - variable: subClass
          label: Topic
          width: half
          showIcon: true
        - variable: codeName
          label: Code name
          width: full
          emphasis: strong
          showIcon: false
databases:
  - id: demo_chemistry_notes
    name: Demo Science Notes
    defaultTemplate: showcase-grid
    templates: [showcase-grid, compact-emblem, cactus-study]
articleFiles:
  - articles/flame-colors.yaml
  - articles/periodic-patterns.yaml
  - articles/lab-notebook.yaml
assets:
  demo_asset_spectrum: demo/spectrum.svg
  demo_asset_class_icon: demo/class-icon.svg
