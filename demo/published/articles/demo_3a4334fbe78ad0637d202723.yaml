  - content:
      - text: >-
          Main Class is a summary of the case's management characteristics and does not replace its
          Standard Deviation Quarantine procedures. When managing a case, personnel must defer to
          the procedures specified in the relevant case file.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
