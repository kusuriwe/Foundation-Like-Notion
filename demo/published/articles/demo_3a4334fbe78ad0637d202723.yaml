  - content:
      - text: Standard Deviation Quarantine
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: >-
          Documents concerning the SDQ Foundation must not be treated as official materials issued
          by any real research institution, government agency, corporation, or other existing
          organization. This archive is a work of fiction that observes and documents ordinary
          objects, systems, customs, and concepts with an unnecessarily serious tone. Even when the
          subject exists in the real world, any Foundation designation, investigation, quarantine
          measure, classification, or similar action is fictional.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          The document format used in this archive is part of a parody/demo project inspired by the
          SCP Foundation. It is not intended to directly reuse SCP-specific settings, classification
          names, terminology systems, or article text.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: Observation Summary
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: The SDQ Foundation (
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: Survey, Documentation and Quarantine Foundation
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: >-
          ) is a fictional organization that observes and documents objects, systems, information,
          customs, phenomena, and other subjects that exhibit meaningful departures from normally
          expected behavior. The Foundation refers to such departures as 
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: Deviations
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: >-
          . A Deviation is not necessarily supernatural. Subjects may qualify simply because they
          are repeatedly reported, operationally inconvenient in peculiar ways, socially difficult
          to explain, or familiar to nearly everyone despite never having been seriously documented.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: 'The Foundation''s general position is summarized as follows:'
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: The fact that something can be explained does not mean that it is not worth documenting.
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: quote
  - content:
      - text: 'Each case is assigned an identifier in the format '
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: SDQ-XXXX
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: true
      - text: >-
          . Case numbers do not, as a rule, correspond to their contents, and personnel are
          discouraged from attempting to infer meaning from the numbers. It has been confirmed that
          this notice increases attempts to infer meaning from the numbers.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: Main Class
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: 'Each SDQ case is assigned a '
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: Main Class (Handling Disposition)
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: ' describing '
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: how the subject responds to management by the Foundation
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: ', rather than how dangerous the subject is.'
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          Main Class does not represent hazard level, importance, or the severity of a Deviation. An
          ordinary and harmless subject may receive a particular Class if its management conditions
          are sufficiently complicated. Conversely, a subject capable of producing significant
          effects may still respond predictably to ordinary management procedures.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: 'The Foundation currently uses the following primary Classes:'
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - type: table
    rows:
      - - - text: Main Class
            href: null
