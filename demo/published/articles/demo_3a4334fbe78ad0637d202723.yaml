              responses frequently create additional problems.
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: Tsumujimagari
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: >-
              Tends to exhibit contrary behavior or unintended outcomes in response to attempts at
              management, correction, or suppression. More intensive intervention does not
              necessarily produce better results.
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: Distributed
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: >-
              The Deviation is distributed across multiple individuals, institutions, devices,
              informational environments, or other components, making isolation or management of a
              single subject insufficient.
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: Administrative
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: >-
              The need for active management is unclear, but the administrative work required to
              close, release, or reclassify the case exceeds the administrative work required to
              continue managing it.
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
