          code: false
    type: paragraph
  - content:
      - text: >-
          Proposals to add, consolidate, or rename Classes are accepted on an ongoing basis. The
          Classification Review Committee, established to prevent unnecessary complexity in the
          classification system, is currently reviewing 17 proposals for new Classes.
        href: null
