  - content:
      - text: "自由記述欄では、「覚えられないので仕方がない」という回答が最も多く確認されました。財団監督部門より「もっと複雑な変更規則を課すべきではないか」という勧告がなされましたが、実験責任者によって記録された後、コメントなしで保留されています。"
