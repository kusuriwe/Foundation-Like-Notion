  - content:
      - text: "SDQ-441を運用するシステムでは、パスワード変更を要求する理由を記録してください。「一定期間が経過したため」という理由だけで変更を要求する場合、変更後の文字列が変更前より推測しにくくなることを事前に仮定してはいけません。同一利用者に対して短期間に複数回の変更を要求する場合、少なくとも直前のパスワードとの差分だけで安全性を評価しないでください。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "以下の形式は、財団内部システムにおいて「変更済み」と「実質的に同一」を同時に満たす例として記録されています。"
