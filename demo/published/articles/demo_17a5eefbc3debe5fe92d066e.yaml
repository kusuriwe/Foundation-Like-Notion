    type: "heading"
    level: 2
  - content:
      - text: "SDQ-441は、利用者に既存のパスワードを破棄し、新しいパスワードを設定するよう要求する制度またはUIです。表面上、SDQ-441は認証情報を更新することで安全性を向上させることを目的としています。しかし、変更要求が反復されると、利用者は「新しい秘密」を考案するよりも、「前回の秘密をシステムが別物と認識する程度に変更する」戦略へ移行する傾向があります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "財団ではこの現象を "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "差分最小化行動"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: " と呼んでいます。変更回数を "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - type: "equation"
        expression: "n"
        text: "n"
      - text: "、元のパスワードから実際に変更された文字数を "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - type: "equation"
        expression: "c"
        text: "c"
      - text: " としたとき、観測された利用者行動は概ね次の方向へ進みます。"
        href: null
