blocks:
  - content:
      - text: Standard Deviation Quarantine
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: >-
          Use of SDQ-287 is not prohibited. However, when SDQ-287 is used in research reports,
          museum exhibits, educational materials, or similar explanatory contexts, personnel must
          confirm the existence of at least one genuine alternative theory, competing
          interpretation, or documented uncertainty.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: SDQ-287 must not be used solely for the purpose of bringing an investigation to an end.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: Observation Summary
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: 'SDQ-287 is the Japanese stock phrase:'
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: 「諸説あります」
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: quote
  - content:
      - text: and other expressions functionally equivalent to it.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          SDQ-287 is used to indicate that multiple explanations exist regarding the origin, cause,
          date, responsible individual, meaning, or other aspects of a given subject. Foundation
          observations indicate, however, that when SDQ-287 is placed at the end of an explanatory
          passage, readers become less likely to request additional information regarding the
          unresolved issue. A similar effect has been observed among authors: following the
          insertion of SDQ-287, further source verification, comparison of competing claims, and
          efforts to avoid unsupported conclusions have been observed to cease.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          SDQ-287 may therefore function not only as an expression of informational uncertainty, but
          also as a 
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: >-
          terminating marker that causes uncertainty itself to be treated as having been adequately
          processed
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: . There are several theories regarding why SDQ-287 exhibits this effect.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
