  - content:
      - text: "Incident Record 1843-2"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "The following incident occurred in Researcher ██'s office."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "code"
    code: "Researcher ██ was reviewing important documents spread across a desk when SDQ-1843 sat down in the center of the papers.\n\nResearcher ██ relocated the subject to an adjacent empty chair.\n\nThe subject returned to the center of the documents after 11 seconds.\n\nResearcher ██ relocated the subject to the floor.\n\nThe subject returned to the center of the documents after 26 seconds.\n\nResearcher ██ moved the documents to another desk.\n\nThe subject followed them to the new location.\n\nThe record ends when Researcher ██ ceased reviewing the documents, let out a prolonged sigh, and began petting the subject."
    language: "plain text"
    caption: []
  - content:
      - text: "The above phenomena suggest that SDQ-1843 may possess a latent capacity to endanger humanity and/or the Foundation."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "All SDQ-1843 individuals currently under Foundation management have therefore been requisitioned by the Oversight Division and transferred to its offices, where they remain under the direct supervision of Oversight personnel."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
