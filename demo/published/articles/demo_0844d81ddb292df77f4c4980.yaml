blocks:
  - content:
      - text: "Standard Deviation Quarantine"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1843 should be treated as an ordinary companion animal under normal husbandry conditions. Subjects must not be forcibly placed into boxes, bags, basins, cardboard containers, storage cases, or other enclosures for the purpose of testing container compatibility. Observation is permitted only when the subject enters voluntarily."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "If a subject relocates onto a laptop, printed material, clothing, packing material, or other item currently in use, the fact that the item was “being used at that exact moment” may not constitute sufficient grounds for relocating the subject."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "image"
    assetId: "demo_4ded586cdb0b79aae0b5be90"
    caption:
      - text: "An ordinary domestic cat voluntarily occupying a small box."
        href: null
        annotations:
          bold: false
