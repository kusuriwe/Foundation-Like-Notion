          code: false
  - content:
      - text: "Observation Summary"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1843 is the ordinary domestic cat ("
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "Felis catus"
        href: null
        annotations:
          bold: false
          italic: true
          strikethrough: false
          underline: false
          code: false
      - text: "). The Foundation has noted repeated instances of SDQ-1843 exhibiting the following properties:"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "numberedList"
    items:
      - - text: "Subjects enter containers that appear, based on external dimensions, to be smaller than their body volume."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Subjects show a tendency to preferentially occupy flat surfaces currently required by a human user."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Subjects may select cardboard shipping boxes over expensive purpose-built products."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Subjects may fail to respond when called while reacting to the sound of packages being opened or handled from considerable distances."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Subjects may alter their posture at the precise moment an observer attempts to take a photograph."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "Members of the general public have been observed describing SDQ-1843 as “liquid” on the basis of Property 1. The Foundation Materials Science Division and Animal Behavior Division have repeatedly explained that this description is metaphorical. A substantial number of Foundation personnel remain skeptical of this conclusion."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Experiment Log 1843-A"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
