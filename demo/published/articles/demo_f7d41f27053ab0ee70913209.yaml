  - content:
      - text: >-
          SDQ-287の使用は禁止されていません。ただし、研究報告、展示解説、教育資料その他においてSDQ-287を使用する場合は、少なくとも1件の実在する異説、反対説、または資料上の不確実性が存在することを確認してください。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: 単に調査を終了させる目的でSDQ-287を使用してはいけません。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: 観測サマリ
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: SDQ-287は、日本語圏の歴史、民俗、文化、自然科学その他の解説文に出現する定型句、
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: 「諸説あります」
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: quote
  - content:
      - text: およびこれと実質的に同等の表現です。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          SDQ-287は、ある事象の起源、理由、年代、人物、意味等について複数の説明が存在することを示す目的で使用されます。一方、財団による観測では、SDQ-287が文章末尾に配置された場合、読者が当該問題について追加情報を要求する確率が低下する傾向があります。執筆者側においても、SDQ-287の挿入後に出典確認、比較検討、断定回避のための追加作業が停止する例が確認されています。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: このためSDQ-287は、情報の不確実性を示す表現であると同時に、
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: 不確実性そのものを処理済みとして扱わせる終端記号
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: として機能する可能性があります。SDQ-287がこの効果を有する理由については、諸説あります。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
