blocks:
  - content:
      - text: "Standard Deviation Quarantine"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "When new setting materials, statements by creators, updates to official websites, sequels, revised editions, or other materials are released for a work affected by SDQ-1178, existing records must not be immediately deleted. If older and newer statements cannot be reconciled, the following information must be recorded for each:"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "numberedList"
    items:
      - - text: "Date and time of publication"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Medium of publication"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Individual or entity responsible for the statement or description"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The degree to which it was regarded as “official” at the time"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Whether it was subsequently overwritten, supplemented, contradicted, or ignored by later material"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "Simple determinations such as “newer means correct” or “older means invalid” must be avoided."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Observation Summary"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1178 is a phenomenon in which information concerning a fictional setting is presented by a creator, rights holder, official publication, or other authoritative source and consequently treated as "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "official canon"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: ". Under ordinary circumstances, SDQ-1178 increases the amount of available information. However, with respect to existing interpretations, fan works, theories, and shared understandings within fan communities, it may function not as the addition of new information but as an "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "alteration of past meaning"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "For example, if the motivation behind a character's actions remains unexplained for an extended period and an official explanation is later issued stating, “This was actually the reason,” interpretations developed by earlier readers may move from “possible correct interpretations” to “outdated theories,” despite the original text itself remaining entirely unchanged."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "The Foundation therefore records SDQ-1178 as an informational phenomenon capable of altering meaning retroactively along the temporal axis."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Example Revision History 1178-C"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - type: "embeddedDatabase"
    title: "1178-C"
    tables:
      - status: "available"
        tableId: "demo_bc8fe8a7258bdb1da6ea6f20"
        title: "1178-C"
        columns:
          - "Stage"
          - "Description"
          - "General Status Among Fans"
        rows:
          - - "Revised edition"
            - "The relevant scene is altered"
            - "An “it was always like this” faction emerges. Retroactive alteration produces significant distortions in the timeline."
          - - "Sequel"
            - "New material suggesting B is introduced"
            - "Attempts are made to reconcile A and B"
          - - "Creator interview"
            - "Creator states, “I hadn't really decided at the time”"
            - "Confusion ensues"
          - - "Official guide"
            - "“A was the reason” is stated"
            - "A becomes the prevailing interpretation"
          - - "Original work"
            - "No reason is explicitly stated"
            - "Multiple interpretations coexist"
        nextCursor: null
  - content:
      - text: "The Foundation is monitoring the phenomenon described in the final row with particular attention."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Incident Record 1178-6"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "An official account associated with ██████'s manga series "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "████████████"
        href: null
        annotations:
          bold: false
          italic: true
          strikethrough: false
          underline: false
          code: false
      - text: " was observed to publish a post identifying the age of the character ██ as “28.” Fourteen minutes after publication, the Foundation discovered that a previous official character profile listed the same character's age as “27.” The Foundation notified ██████ of the discrepancy through government channels."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Twenty-seven minutes later, the post was deleted for reasons unknown. However, as the Foundation possessed neither the technology nor the enthusiasm required to control the memories of third parties, attempts to mitigate the effects of the resulting SDQ-1178 contradiction were unsuccessful. The following theories subsequently came to coexist within the fan community surrounding "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "████████████"
        href: null
        annotations:
          bold: false
          italic: true
          strikethrough: false
          underline: false
          code: false
      - text: ":"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "bulletedList"
    items:
      - - text: "The character is 27."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The character is 28."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The character had a birthday during the events of the story."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The character's age differs between media."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The official sources do not know either."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The fact that the character has no fixed age is itself official canon."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "The Foundation Interrogation Division has scheduled the interrogation and enhanced interrogation of the creator and employees of the publisher."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Supplement 1178-G"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "During a meeting concerning SDQ-1178, the following question was submitted:"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "“If a creator's statements contradict the work itself, which should take precedence?”"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Citing concerns regarding the potential fragmentation, dissolution, or weakening of the Foundation, the Oversight Division has frozen all attempts to answer this question indefinitely."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
