  - content:
      - text: "財団は、最終行の現象を特に注意して観測しています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "事件記録 1178-6"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "██████氏の漫画作品『████████████』について、公式アカウントが登場人物██の年齢を「28歳」と投稿していることが確認されました。しかし投稿から14分後、財団は過去の公式プロフィールに「27歳」と記載されていることを発見しました。財団は政府機関経由で██████氏に指摘を通達しました。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "27分後、投稿は未知の理由により削除されましたが、財団には他者の記憶を制御する技術も熱意もなかったため、SDQ-1178の矛盾による影響の緩和に失敗しました。以後、漫画作品『████████████』のファンコミュニティ内では以下の説が並存することとなりました。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "bulletedList"
    items:
      - - text: "27歳説"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "28歳説"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "作中で誕生日を迎えた説"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "媒体ごとに設定が異なる説"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "公式も分かっていない説"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "年齢を固定しないことが公式設定である説"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "財団尋問部による作者及び出版社従業員への尋問および強化尋問が予定されています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "補遺 1178-G"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1178に関する会議で、「作者の発言と作品本文が矛盾した場合、どちらを優先するか」という質問が提出されましたが、財団の分裂・解体や弱体化を懸念した監督部門によりこの質問への回答は無期限に凍結されました。"
        href: null
