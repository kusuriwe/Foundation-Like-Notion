            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "後続資料によって上書き、補足、否定、または無視されたか"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "「最新なので正しい」「古いので無効」という単純な処理は避けてください。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "観測サマリ"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1178は、作品世界に関する情報が、制作者、権利者、公式媒体その他から提示されることで「公式設定」として扱われる現象です。通常、SDQ-1178は情報を増加させます。一方、既存の解釈、二次創作、考察、ファン間の共通理解に対しては、情報の追加ではなく"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "過去の意味の変更"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "として作用する場合があります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "たとえば、ある人物の行動理由が長期間不明だった作品において、後年「実はこういう理由でした」と公式説明が追加された場合、それ以前の読者が行っていた解釈は、文章自体が変化していないにもかかわらず「正解候補」から「旧説」へ移動します。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "このため財団では、SDQ-1178を時間方向に遡って意味づけを変更する情報現象として記録しています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "改訂履歴例 1178-C"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
