  - content:
      - text: "SDQ-1178の影響を受ける作品について、新たな設定資料、作者発言、公式サイト更新、続編、再編集版その他が公開された場合、既存資料を直ちに削除してはいけません。新旧の記述が両立しない場合は、各記述について以下を記録してください。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "numberedList"
