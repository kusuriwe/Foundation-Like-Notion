blocks:
  - content:
      - text: Standard Deviation Quarantine
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: >-
          Individuals affected by SDQ-526 do not require blanket separation from the relevant
          subject. However, if sustained effects on spending, sleep, employment, education, or other
          aspects of daily life are observed, personnel should assess the magnitude of those effects
          individually rather than treating the subject itself as the problem. Instructions such as
          “reduce the number of your oshi” or “switch to a different oshi” are not recognized as
          effective management procedures.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          When birthdays, anniversaries, graduations, retirements, finales, limited sales, preorder
          deadlines, or similar events occur, the affected individual's statement that “this time is
          an exception” must not be treated as a constant for budgeting purposes.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: Observation Summary
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: >-
          SDQ-526 is a phenomenon involving sustained, action-oriented support toward a person,
          character, creative work, group, or other subject that extends beyond ordinary preference
          or affection. The subject of SDQ-526 is commonly referred to in Japanese as an 
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: oshi
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: >-
          : a person, character, or other subject to whom an individual directs particular
          enthusiasm and active support.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          Observed instances of SDQ-526 exert the following effects on the affected individual's
          decision-making:
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - type: bulletedList
    items:
      - - text: >-
            The perceived price of merchandise associated with the oshi is systematically
            undervalued relative to unrelated goods.
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: >-
            Purchasing multiple copies of materially identical products is reclassified as a
            rational decision.
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: Travel distances are categorized as “doable” rather than “far.”
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: >-
            Weekday schedules are reorganized around event start times. This may result in the
            reduction or omission of time allocated to activities necessary for survival, including
            sleep and meals.
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: >-
            Success achieved by the oshi produces substantial satisfaction in the affected
            individual despite not constituting an achievement by that individual.
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: >-
          These behaviors are not necessarily harmful. SDQ-526 may instead have positive effects on
          personal motivation, community formation, creative activity, consumer activity, and other
          aspects of daily life.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: >-
          The Deviation recorded by the Foundation is that affected individuals routinely describe
          SDQ-526 as “just a hobby,” while the same hobby independently exerts measurable influence
          over transportation planning, household finances, sleep schedules, social relationships,
          and the annual calendar.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
