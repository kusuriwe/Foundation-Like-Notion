  - content:
      - text: "第6試行終了後、不正解であった参加者のうち12名が自己効用感の低下を理由に休職しました。また参加者のうち5名も、ただしく回答できたのにも関わらず実存的不安を経験しており自分探しの旅に出たいという旨の回答を残しました。監督部門は財団運営におけるSDQ-072の潜在的な危険について研究部門へ調査を命じました。"
