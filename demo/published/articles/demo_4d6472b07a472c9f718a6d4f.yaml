blocks:
  - content:
      - text: "標準偏差隔離プロトコル"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-072を利用する認証システムでは、同一利用者に対して画像選択課題を連続して提示する場合、代替認証手段を用意してください。利用者が3回以上連続して「信号機」「横断歩道」「オートバイ」等の境界事例を判定させられている場合、その利用者の人間性を追加試験する前に、試験側の定義が十分に人間向けであるかを確認してください。財団職員は、業務上必要のないSDQ-072を「自分がまだ人間として認識されるか確認する目的」で繰り返し実施してはいけません。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "image"
    assetId: "demo_9afd9cf1d8db69d751a95b6e"
    caption:
      - text: "3×3の一般的な画像グリッドで構成されたSDQ-072。複数マスにまたがる信号機の端部、遠景の横断歩道、判別困難な二輪車等を含む。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
  - content:
      - text: "観測サマリ"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-072は、自動化されたアクセスと人間によるアクセスを区別するため、人間側に認知課題を課す認証方式の総称です。典型的なSDQ-072では、利用者は画像内の物体を識別し、特定の条件に合致する領域を選択するよう求められます。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "財団が注目しているDeviationは、認証が長引くほど利用者が「画像に何が写っているか」ではなく、"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "「このシステムは何を正解と見なすか」"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "を推測し始める点にあります。たとえば、信号機の支柱だけが写るマス、車体の一部だけが写るマス、遠景で数ピクセルしか存在しない対象などについて、利用者は現実世界の分類よりも未知の教師データ上の分類を優先する傾向を示します。この状態では、人間であることを証明する課題が、人間の視覚認知を測定するというより、機械の判断基準を人間が模倣できるかを測定している可能性があります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "実験記録 072-B"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
