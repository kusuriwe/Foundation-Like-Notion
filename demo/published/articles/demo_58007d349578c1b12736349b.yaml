blocks:
  - content:
      - text: "Standard Deviation Quarantine"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "Devices designated as SDQ-994 may remain in service as ordinary office printers. However, SDQ-994 must not be used as the sole means of producing documents when fewer than 30 minutes remain before a submission, dispatch, meeting, or other explicit deadline. An electronic copy or a secondary output device must be available as an alternative."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Personnel using SDQ-994 must confirm the following before initiating a print job:"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "bulletedList"
    items:
      - - text: "Sufficient paper is loaded."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Toner or ink levels are adequate."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Network connectivity has been established."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "The fact that the printer was “working normally a moment ago” is not treated as grounds for reassurance."
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "The judgment that “it will probably be fine because I'm in a hurry” is recorded as a known risk factor associated with SDQ-994."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Observation Summary"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-994 is the collective designation for ordinary printers used in offices, schools, public facilities, and similar environments, together with their associated printing infrastructure. Devices designated as SDQ-994 generally operate within normal specifications under ordinary conditions. However, when users are subject to time constraints, the following events are reported at elevated rates:"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "bulletedList"
    items:
      - - text: "Paper jams"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Depleted paper supplies"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Depleted toner"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Stalled print queues"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Jobs being sent to unintended printers"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Unexpected changes to duplex settings"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "Unexplained “offline” states"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "A second, unrelated error immediately following resolution of the first"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "An internal investigation by the Foundation Statistics Division has identified a tendency for SDQ-994-related failure reports to increase when users believe that a document “must be printed immediately.” Conversely, the effect becomes substantially less reproducible during scheduled testing, simulated deadlines, or situations in which sufficient time remains to recover from equipment failure."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "At present, no physical mechanism by which SDQ-994 could detect time constraints themselves has been identified."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Assessment Log 994-A"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "Twelve printers of the same general model within Foundation facilities were observed to determine the relationship between time remaining before a deadline and print failure rate."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "table"
    rows:
