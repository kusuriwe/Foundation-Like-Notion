              code: false
    hasColumnHeader: true
    hasRowHeader: false
  - content:
      - text: "In response to these results, the Oversight Division revised the regulations governing the use of SDQ-994-designated equipment and mandated immediate disciplinary action against personnel making the prohibited utterance in particular."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "The Statistics Division has noted potential sampling bias in the final condition."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Incident Record 994-3"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "On 20██/06/14, Researcher ██ began printing 42 copies of materials for an external meeting scheduled to begin at 16:00. Printing commenced at 15:41."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "code"
    code: "15:43 — SDQ-994 reports a paper jam.\n\n15:45 — The paper jam is cleared.\n\n15:46 — SDQ-994 reports insufficient magenta toner. The document is monochrome.\n\n15:48 — Personnel confirm that the print setting cannot be changed from “Color.” Video records indicate a marked deterioration in Researcher ██'s psychological state.\n\n15:51 — The issue is resolved.\n\n15:52 — Of the 42 copies requested, only the first is produced.\n\n15:53 — Researcher ██ states, “Forget it. I'll show them the PDF.” At the same moment, SDQ-994 abruptly resumes normal operation.\n\n15:54 — The remaining 41 copies print without error.\n\n16:01 — Researcher ██ runs into the meeting room. The meeting has already been in progress for one minute. Researcher ██ collapses to the floor in tears."
    language: "plain text"
    caption: []
  - content:
      - text: "The above incident suggests that SDQ-994 may possess a degree of intelligence substantially greater than previously assumed. Administration of an intelligence test is currently awaiting approval from the Oversight Division."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "The Statistics Division has noted potential sampling bias."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Supplement 994-B"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "Since Incident Record 994-3, the explanation “it starts working once you give up” has circulated informally throughout the facility. In response to this finding, the Oversight Division is preparing a further revision of the relevant regulations."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
