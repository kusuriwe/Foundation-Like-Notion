  - content:
      - text: "以下は██研究員のオフィスで発生した事件の記録です。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "code"
    code: "██研究員が重要書類を机上に広げて確認していたところ、SDQ-1843が書類中央に着座しました。\n\n██研究員は対象を隣の空席へ移動させました。\n\n対象は11秒後に書類中央へ戻りました。\n\n██研究員は対象を床へ移動させました。\n\n対象は26秒後に書類中央へ戻りました。\n\n██研究員は書類を別の机へ移動させました。\n\n対象は移動先を追跡しました。\n\n記録は、██研究員が書類確認を中止し、大きなため息をつきながら対象を撫ではじめた時点で終了しています。"
    language: "plain text"
    caption: []
  - content:
      - text: "以上の現象は、SDQ-1843が人類もしくは財団に対して潜在的な危険性を保持していることを示唆しています。現在財団が管理するすべてのSDQ-1843個体は監督部門オフィスに接収され、監督職員の管理下に置かれています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
