          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1843は、一般的なイエネコ（"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "Felis catus"
        href: null
        annotations:
          bold: false
          italic: true
          strikethrough: false
          underline: false
          code: false
      - text: "）です。財団では、SDQ-1843が以下の性質を反復して示すことに注目しています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "numberedList"
    items:
      - - text: "外形上、身体容積より小さく見える容器へ進入します。"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "使用者が必要としている平面を優先的に占有する傾向があります。"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "高価な専用品より、配送用の段ボール箱を選択する場合があります。"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "呼びかけには応答しない一方、開封音や包装音に対して遠距離から反応する場合があります。"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: "観測者が写真を撮ろうとした瞬間に姿勢を変更することがあります。"
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: "一般社会では、1の性質を根拠としてSDQ-1843を「液体」と表現する事例があります。財団材料科学部門・生物行動部門は、この表現が比喩であることを繰り返し説明していますが、職員の多くはこの見解に懐疑的です。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
