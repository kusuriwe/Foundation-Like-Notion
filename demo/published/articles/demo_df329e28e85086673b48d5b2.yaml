  - content:
      - text: "SDQ-1843は、一般的な飼育環境において通常の愛玩動物として扱ってください。容器適合性を確認する目的で、対象を箱、袋、洗面器、段ボール、収納ケースその他へ強制的に入れてはいけません。観測は対象が自発的に進入した場合に限ります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "対象が作業中のノートPC、印刷物、衣類、梱包材等の上に移動した場合、それらの物品が「ちょうど使用中だった」ことは対象を移動させる根拠として十分ではない場合があります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "image"
    assetId: "demo_728d0e40b450611ad3029abe"
    caption:
      - text: "自発的に小型の箱へ収まっている一般的なイエネコ"
