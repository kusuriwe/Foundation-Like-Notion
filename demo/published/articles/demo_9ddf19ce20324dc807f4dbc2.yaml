blocks:
  - content:
      - text: "Standard Deviation Quarantine"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1311 must not be used as the sole basis for decision-making, research conclusions, personnel evaluations, accident analysis, or similar judgments. When an instance of SDQ-1311 is cited in support of a particular course of action, personnel must determine whether another instance of SDQ-1311 exists that can be used to support the opposite course of action."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "If both are found, the Foundation shall conclude that “a sufficient amount of cultural wisdom has accumulated” and return to ordinary evidence."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Observation Summary"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1311 is the collective designation for short expressions that have been repeatedly used over extended periods and are shared as general lessons or rules of experience. Individual instances of SDQ-1311 may contain useful practical wisdom. When considered collectively, however, SDQ-1311 can provide mutually contradictory courses of action simultaneously."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "table"
    rows:
