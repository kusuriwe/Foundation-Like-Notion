  - content:
      - text: >-
          Following completion of the sixth trial, twelve participants who had answered incorrectly
          took leave from their duties, citing a diminished sense of self-efficacy. An additional
          five participants, despite having answered correctly, reported experiencing existential
          anxiety and expressed a desire to “go on a journey to find themselves.”
        href: null
