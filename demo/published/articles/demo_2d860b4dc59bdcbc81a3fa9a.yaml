  - content:
      - text: >-
          The most common response in the free-response section was, “I can't remember them
          otherwise.” The Foundation Oversight Division subsequently issued a recommendation asking
          whether more complex password-change rules should be imposed. The recommendation was
          recorded by the lead researcher and placed on hold without comment.
