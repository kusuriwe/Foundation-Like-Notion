  - content:
      - text: >-
          SDQ-441 is a policy or user interface that requires users to discard an existing password
          and establish a new one. Nominally, SDQ-441 is intended to improve security by refreshing
          authentication credentials. However, when change requests are repeated, users tend to
          shift from inventing 
        href: null
