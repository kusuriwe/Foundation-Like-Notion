          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: ' to adopting a strategy of '
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: >-
          “modifying the previous secret only enough for the system to recognize it as something
          different.”
        href: null
