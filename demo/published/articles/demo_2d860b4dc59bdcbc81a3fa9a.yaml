  - content:
      - text: Standard Deviation Quarantine
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: heading
    level: 2
  - content:
      - text: >-
          Systems using SDQ-441 must record the reason a password change is being required. When a
          change is required solely because a fixed period has elapsed, administrators must not
          assume in advance that the replacement string will be less predictable than the previous
          one. If the same user is required to change a password repeatedly within a short period,
          security must not be evaluated solely on the basis of how much the new password differs
          from the immediately preceding one.
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
