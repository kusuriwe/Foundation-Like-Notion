  - content:
      - text: "編集上の注記"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "本デモに収録される記事は、デモ制作者とOpenAIのAIであるChatGPTとの共同制作です。AIは、構成案、文体調整、表現の展開、英訳その他の作業に利用されています。ただし、本文中に見られる皮肉、揚げ足取り、過剰な一般化、および日常生活に対する必要以上に意地の悪い観察について、生成AIのみを責任主体とする解釈は推奨されません。"
        href: null
