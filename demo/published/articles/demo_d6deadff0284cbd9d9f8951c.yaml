blocks:
  - content:
      - text: "本コンテンツについて"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "callout"
    icon:
      kind: "emoji"
      value: "💡"
    color: "gray_background"
    children:
      - content:
          - text: "本コンテンツは、SCP財団に着想を得た中二病チックな Notion Viewer に付随する、デモ用のパロディ文書です。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
        type: "paragraph"
      - content:
          - text: "本コンテンツは独立した創作物として制作されており、SCP FoundationおよびSCP Wikiの公式コンテンツおよび派生作品ではなく、それらの運営者・執筆者との提携、承認その他の関係を示すものではありません。また、独立した創作コミュニティの形成・運営を目的とするものではありません。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
        type: "paragraph"
      - content:
          - text: "「SDQ財団」は、文書型共同創作・機密研究資料等の表現形式を題材として制作されたデモンストレーション用のフィクションです。実在の団体とは関係ありません。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
        type: "paragraph"
  - content:
      - text: "標準偏差隔離プロトコル"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ財団に関する文書は、現実の研究機関・行政機関・企業その他の実在組織による公式資料として扱わないでください。本アーカイブは、日常的な物品・制度・慣習・概念を、必要以上に深刻な調子で観測・記録するためのフィクションです。記述対象が現実に存在する場合でも、財団による指定、調査、隔離、分類等は架空のものです。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "また、本アーカイブの文書形式はSCP Foundationから着想を得たパロディ／デモ用フィクションですが、SCP固有の設定、分類名、専門用語体系、記事本文をそのまま再利用することを目的としていません。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "観測サマリ"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ財団（"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "Survey, Documentation and Quarantine Foundation"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "）は、通常期待される挙動から意味のあるズレを示す物品、制度、情報、習慣、現象等を観測・記録する架空組織です。財団では、このようなズレを "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "Deviation（逸脱）"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: " と呼びます。Deviationは必ずしも超常現象ではありません。単に繰り返し報告されるもの、運用上妙に面倒なもの、社会的に説明しづらいもの、あるいは誰もが経験しているにもかかわらず真面目に記録したことのないものも対象になります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "財団の基本姿勢は、以下の一文に要約されます。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "説明可能であることと、記録する価値がないことは同義ではありません。"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "quote"
  - content:
      - text: "各案件には "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "SDQ-XXXX"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: true
      - text: " 形式の識別番号が割り当てられます。案件番号は原則として内容と対応しておらず、数字から意味を読み取ろうとする行為は推奨されません。なお、この注意書きによって数字から意味を読み取ろうとする行為が増加することは確認されています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Main Class"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "各SDQ案件には、対象の危険性ではなく、"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "財団による管理に対して対象がどのように応答するか"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "を示す "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "Main Class（管理応答性）"
        href: null
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: " が設定されます。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Main Classは危険度、重要度、異常性の強さを表すものではありません。日常的かつ無害な対象であっても管理条件が複雑であれば特定のClassに分類される場合があり、反対に重大な影響を持つ対象であっても通常の管理手順に安定して応答する場合があります。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "現在、財団では主に以下のClassを使用しています。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "table"
    rows:
      - - - text: "Main Class"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: "概要"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: "Docile"
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: "通常の管理手順に対して概ね予測可能に応答します。特別な条件を必要とせず、既存の制度・設備・手順によって管理可能です。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: "Kojire"
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: "管理自体は可能ですが、条件、例外、関係者の認識その他の要因によって容易に状況がこじれます。単純化した対応は、しばしば追加の問題を発生させます。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: "Tsumujimagari"
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: "管理、修正、抑制等の試みに対して、反対方向の挙動または意図しない結果を示す傾向があります。より強い介入が、より良い結果をもたらすとは限りません。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: "Distributed"
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: "Deviationが複数の人物、制度、機器、情報環境その他に分散しており、単一対象の隔離または管理では十分な効果が得られません。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
      - - - text: "Administrative"
            href: null
            annotations:
              bold: true
              italic: false
              strikethrough: false
              underline: false
              code: false
        - - text: "積極的な管理の必要性は明確ではありませんが、案件を終了、解除、再分類するために必要な事務処理が、継続管理に必要な事務処理を上回っています。"
            href: null
            annotations:
              bold: false
              italic: false
              strikethrough: false
              underline: false
              code: false
    hasColumnHeader: true
    hasRowHeader: false
  - content:
      - text: "Main Classは案件の性質に関する要約であり、標準偏差隔離プロトコルそのものを代替するものではありません。実際の管理に際しては、各案件に記載された手順を優先してください。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "なお、Classの追加、統合、改称に関する提案は随時受け付けられています。分類体系の複雑化を防止する目的で設置された分類検討委員会は、現在17件の新Class案を審議中です。"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
