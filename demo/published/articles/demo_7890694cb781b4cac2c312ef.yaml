  - content:
      - text: >-
          監督部門はこの結果を受け、SDQ-994指定機器利用時の規約を改定し、特に禁則発言を行った職員の即時懲戒を義務付けました。なお最後の条件について、統計部門はサンプルの偏りを指摘しています。
