  - content:
      - text: >-
          SDQ-994に該当する機器は、一般的な事務用プリンタとして継続使用して構いません。ただし、提出、発送、会議開始その他の明示的な期限まで30分を切った文書について、SDQ-994のみを出力手段として使用してはいけません。電子媒体または第二の出力装置による代替手段を確保してください。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - content:
      - text: SDQ-994を利用する職員は、印刷開始前に以下を確認してください。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - type: bulletedList
    items:
      - - text: 用紙が十分に補充されていること。
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: トナーまたはインク残量が十分あること。
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: ネットワーク接続が確立されていること。
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
      - - text: 使用予定のプリンタが、直前まで「正常に動作していた」ことを安心材料として扱わない。
          href: null
          annotations:
            bold: false
            italic: false
            strikethrough: false
            underline: false
            code: false
  - content:
      - text: 「急いでいるので今回は大丈夫だろう」という判断は、SDQ-994に関する既知のリスク要因として記録されています。
        href: null
