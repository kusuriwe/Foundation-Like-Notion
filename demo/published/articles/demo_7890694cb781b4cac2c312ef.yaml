    type: heading
    level: 2
  - content:
      - text: 20██/06/14、██研究員は16:00開始予定の外部会議に使用する資料42部を15:41から印刷しました。
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: paragraph
  - type: code
    code: |-
      15:43、SDQ-994が紙詰まりを報告する。

      15:45、紙詰まりが解消される。

      15:46、SDQ-994はマゼンタトナー残量不足を報告する。対象文書は白黒。

      15:48、印刷設定が「カラー」から変更できないことが確認される。映像記録からは██研究員の精神状態が著しく悪化していることが確認できる。

      15:51、当該問題が解消される。

      15:52、印刷ジョブ42部のうち、最初の1部のみが出力される。

      15:53、██研究員は「もういい、PDFで見せる」と発言。同時に、SDQ-994が突如として正常な動作を再開する。

      15:54、残り41部が正常に印刷される。

      16:01、██研究員は会議室に駆け込む。会議は1分前より開始されている。██研究員がその場で泣き崩れる。
    language: plain text
    caption: []
  - content:
      - text: >-
