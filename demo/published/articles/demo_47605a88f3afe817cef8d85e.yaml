blocks:
  - content:
      - text: "Standard Deviation Quarantine"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1609 may be stored, distributed, and consumed as ordinary food. When SDQ-1609 is used as a comparative unit in explanations concerning radiation, it must be clearly stated that it is not an official SI unit, but an informal comparison intended to aid understanding. We are tired of explaining this. This is our limit."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "If the use of bananas to make a comparison easier to understand results in the audience becoming more interested in the bananas than in the original subject, a different unit should be used."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "image"
    assetId: "demo_0424e79430141a862e0518d1"
    caption:
      - text: "SDQ-1609. Radiation meter shown for illustrative purposes."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
  - content:
      - text: "Observation Summary"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "SDQ-1609 is the fruit commonly known as a “banana.”"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "SDQ-1609 contains naturally occurring potassium, a portion of which consists of radioactive isotopes. As a result, SDQ-1609 is sometimes used as a familiar point of comparison when explaining low doses of radiation. In official documentation, the Foundation Communications Division uses the "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: "Banana Equivalent Dose"
        href: "https://en.wikipedia.org/wiki/Banana_equivalent_dose"
        annotations:
          bold: true
          italic: false
          strikethrough: false
          underline: false
          code: false
      - text: ", "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - type: "equation"
        expression: "N_B"
        text: "N_B"
      - text: ", defined for an arbitrary dose "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - type: "equation"
        expression: "D"
        text: "D"
      - text: " using an explanatory reference quantity "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - type: "equation"
        expression: "d_B"
        text: "d_B"
      - text: " representing the “reference dose equivalent to one SDQ-1609,” as follows:"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - type: "math"
    expression: "N_B = \\frac{D}{d_B}"
  - content:
      - text: "However, "
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
      - type: "equation"
        expression: "N_B"
        text: "N_B"
      - text: " is not a formal unit of physics. This is explained every single time. Please stop. The fact that this must be explained every single time is itself one of the primary observations associated with SDQ-1609."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Supplement 1609-D"
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "heading"
    level: 2
  - content:
      - text: "During a meeting of the Oversight Division, the researcher responsible for the initial draft of this report was asked to explain the radiation-exposure risks associated with collecting large quantities of bananas. Despite repeatedly making irregular statements throughout the process, the researcher continued the explanation for 131 minutes, eventually reaching a consensus among all participants."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "Of particular note, the researcher responsible for the explanation subsequently exhibited a phenomenon in which severe stress rendered them unable to continue performing their duties. The staff member is currently on medical leave."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
  - content:
      - text: "The Foundation Interrogation Division is currently investigating potential applications of this phenomenon in enhanced interrogation."
        href: null
        annotations:
          bold: false
          italic: false
          strikethrough: false
          underline: false
          code: false
    type: "paragraph"
